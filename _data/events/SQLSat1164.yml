description: |
  <p><strong>Day of Data Detroit 2026</strong> is a free, community-driven, in-person technical education event for data professionals, developers, architects, analysts, AI practitioners, students, technology leaders, and community members across Detroit, Southeast Michigan, and the surrounding region.</p>
  <p><strong>Attendance is completely free.</strong> Registration is required. <strong><a href="https://www.eventbrite.com/e/day-of-data-detroit-2026-tickets-1998135403781" target="_blank" rel="noopener noreferrer">Register free on Eventbrite</a>.</strong></p>
  <p><strong>Event hours:</strong> Saturday, September 12, 2026, 10:30 AM-4:45 PM EDT. Doors open at 10:00 AM. The event will be held at the Ann Arbor District Library - Downtown.</p>
  <h3>Why Attend?</h3>
  <ul>
    <li>Learn practical techniques, patterns, and lessons from experienced community speakers and industry practitioners.</li>
    <li>See technical sessions and demos focused on real-world data, analytics, database, cloud, streaming, and AI scenarios.</li>
    <li>Connect with fellow data professionals, speakers, students, technology leaders, and local community members.</li>
    <li>Build your professional network and discover new ideas for career development, certification, architecture, engineering, analytics, and AI.</li>
  </ul>
  <h3>Who Should Attend?</h3>
  <p>Content is intended for a wide range of skill levels, from students and early-career professionals to experienced DBAs, developers, data engineers, BI professionals, architects, administrators, AI/ML practitioners, consultants, managers, and technology leaders.</p>
  <h3>Technical Focus</h3>
  <ul>
    <li><strong>SQL Server and Azure SQL:</strong> administration, performance, development, modernization, high availability, security, and cloud database services.</li>
    <li><strong>Microsoft Fabric and Power BI:</strong> data engineering, analytics, semantic models, Real-Time Intelligence, governance, and business intelligence.</li>
    <li><strong>Azure Databricks and Modern Data Engineering:</strong> lakehouse architecture, data pipelines, streaming, governance, analytics, and AI-enabled data platforms.</li>
    <li><strong>AI and Generative AI:</strong> machine learning, AI agents, copilots, retrieval-augmented generation, responsible AI, and practical enterprise AI scenarios.</li>
    <li><strong>Architecture, Governance, and Professional Development:</strong> data architecture, quality, security, governance, certification, career growth, and community knowledge sharing.</li>
  </ul>
  <p>Sessions will feature local and regional community speakers and industry practitioners. Up to two technical sessions can run in parallel.</p>
  <p><strong>Speaker CFP:</strong> We are accepting 45-60 minute session proposals through September 12, 2026. <a href="https://sessionize.com/day-of-data-detroit-2026" target="_blank" rel="noopener noreferrer"><strong>Submit a session on Sessionize</strong></a>.</p>

