    <div class="dod-hero">
      <div class="dod-kicker">Free Community Data + AI Conference</div>
      <h2>Where Data Professionals, Builders, Leaders &amp; Learners Connect in Southeast Michigan</h2>
      <p><strong>Day of Data Detroit 2026</strong> is a volunteer-led, in-person technical conference focused on practical data, analytics, cloud, database and AI learning. Join local and regional practitioners for real implementation stories, technical demos, career development and meaningful community networking.</p>
      <div class="dod-actions">
        <a class="primary" href="https://www.eventbrite.com/e/day-of-data-detroit-2026-tickets-1998135403781" target="_blank" rel="noopener noreferrer">Register Free</a>
        <a class="secondary" href="https://sessionize.com/day-of-data-detroit-2026" target="_blank" rel="noopener noreferrer">Speaker CFP - Submit a Session</a>
        <a class="secondary" href="#sponsorship">Become a Sponsor</a>
      </div>
    </div>

    <div class="dod-facts">
      <div class="dod-fact"><strong>September 12, 2026</strong>Saturday</div>
      <div class="dod-fact"><strong>10:00 AM-4:30 PM</strong>Eastern Time</div>
      <div class="dod-fact"><strong>2 Technical Tracks</strong>Two library meeting rooms</div>
      <div class="dod-fact"><strong>$0 Admission</strong>Optional $15 lunch ticket</div>
      <div class="dod-fact"><strong>Free Parking</strong>Northville District Library</div>
    </div>

    <h3 class="dod-section-title">Why You Should Attend</h3>
    <div class="dod-grid">
      <div class="dod-card"><h4>Real-World Data &amp; AI</h4><p>Learn how practitioners are solving production challenges across modern data platforms, analytics, governance and AI.</p></div>
      <div class="dod-card"><h4>Technical Sessions &amp; Demos</h4><p>See practical architectures, implementation patterns, demos and lessons that you can apply in your own environment.</p></div>
      <div class="dod-card"><h4>Expert Community Talks</h4><p>Hear from experienced local and regional speakers, Microsoft community experts, Databricks practitioners and data leaders.</p></div>
      <div class="dod-card"><h4>Career &amp; Certification</h4><p>Build skills, explore certifications, learn from practitioners and connect with people across different stages of their data careers.</p></div>
      <div class="dod-card"><h4>Community Networking</h4><p>Meet data engineers, architects, developers, analysts, DBAs, AI practitioners, consultants, students and technology leaders.</p></div>
      <div class="dod-card"><h4>Two Concurrent Tracks</h4><p>Choose between parallel sessions so you can focus on the topics most relevant to your work and interests.</p></div>
    </div>

    <h3 class="dod-section-title">Who Should Attend</h3>
    <p style="text-align:center;">Whether you are building enterprise data and AI solutions or starting your technical journey, the event is designed for a broad Southeast Michigan audience.</p>
    <div class="dod-audience">
      <div class="dod-persona"><h4>Data Engineers</h4><p>Pipelines, lakehouse, streaming and platform engineering.</p></div>
      <div class="dod-persona"><h4>DBAs &amp; Developers</h4><p>SQL Server, Azure SQL, performance, modernization and development.</p></div>
      <div class="dod-persona"><h4>BI &amp; Analytics Professionals</h4><p>Power BI, semantic models, reporting and analytics.</p></div>
      <div class="dod-persona"><h4>Architects &amp; Leaders</h4><p>Architecture, governance, security, strategy and delivery.</p></div>
      <div class="dod-persona"><h4>AI &amp; ML Practitioners</h4><p>GenAI, agents, RAG, machine learning and enterprise AI.</p></div>
      <div class="dod-persona"><h4>Students &amp; Learners</h4><p>Technical learning, certification, mentoring and career connections.</p></div>
    </div>

    <h3 class="dod-section-title">Technical Focus</h3>
    <div class="dod-topics">
      <div class="dod-topic"><h4>SQL Server &amp; Azure SQL</h4><p>Administration, development, performance, high availability, modernization and security.</p></div>
      <div class="dod-topic"><h4>Microsoft Fabric &amp; Power BI</h4><p>Data engineering, Real-Time Intelligence, semantic models, analytics, governance and BI.</p></div>
      <div class="dod-topic"><h4>Databricks &amp; Modern Data Engineering</h4><p>Lakehouse architecture, streaming, governance, analytics, Unity Catalog and AI-enabled data platforms.</p></div>
      <div class="dod-topic"><h4>AI &amp; Generative AI</h4><p>AI agents, copilots, RAG, machine learning, responsible AI and practical enterprise use cases.</p></div>
      <div class="dod-topic"><h4>Architecture &amp; Governance</h4><p>Data architecture, quality, security, observability, governance and platform strategy.</p></div>
      <div class="dod-topic"><h4>Professional Development</h4><p>Certification, career growth, technical leadership, speaking and community knowledge sharing.</p></div>
    </div>

    <div class="dod-callout">
      <h3>Speaker Call for Proposals</h3>
      <p>We are accepting <strong>45-60 minute session proposals through September 12, 2026</strong> from local and regional data professionals, Microsoft MVPs, Microsoft Certified Trainers, community speakers and industry practitioners.</p>
      <p><a href="https://sessionize.com/day-of-data-detroit-2026" target="_blank" rel="noopener noreferrer"><strong>Submit your Day of Data Detroit session on Sessionize</strong></a></p>
    </div>

    <h3 class="dod-section-title">Event Location &amp; Logistics</h3>
    <div class="dod-grid">
      <div class="dod-card"><h4>Northville District Library</h4><p>212 W Cady St<br/>Northville, MI 48167</p><p><strong>Saturday, September 12<br/>10:00 AM-4:30 PM EDT</strong></p></div>
      <div class="dod-card"><h4>Free Parking</h4><p>Free parking is available at the Northville District Library. Additional public parking is available nearby in downtown Northville; follow posted signs and time limits.</p></div>
      <div class="dod-card"><h4>Room Configuration</h4><p>Carlo Meeting Room: maximum 50 people.<br/>Friends Community Room: maximum 20 people.<br/>Up to two sessions can run in parallel.</p></div>
      <div class="dod-card"><h4>Registration &amp; Lunch</h4><p>Conference admission is completely free. A separate optional <strong>$15 lunch ticket</strong> is available. Lunch is not required to attend.</p></div>
    </div>

    <div class="dod-sponsor">
      <h3>Help Power the Southeast Michigan Data &amp; AI Community</h3>
      <p>Organizations can support technical education, attendee refreshments, speaker support, event materials and community engagement through sponsorships starting at <strong>$100</strong>, larger sponsor packages, or useful in-kind contributions such as restaurant/grocery gift cards, food-purchase cards, catering credit, training, software or raffle items.</p>
      <p><strong>Confirmed Community Sponsor: Neo4j - $250.</strong></p>
      <div class="dod-actions">
        <a class="primary" href="mailto:mouraksh@umich.edu?subject=Day%20of%20Data%20Detroit%202026%20-%20Sponsorship">Explore Sponsorship</a>
        <a class="secondary" href="/michigan-data-ai-community/">Michigan Data &amp; AI Community</a>
      </div>
    </div>

    <p class="dod-note"><strong>Community reach:</strong> The event is being promoted across Southeast Michigan with a goal of 200+ registrations and community participants. On-site attendance at any one time is limited by the two library meeting rooms, which have a combined physical capacity of approximately 70.</p>

