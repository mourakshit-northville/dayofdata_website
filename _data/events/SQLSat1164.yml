  <h1><a name="sponsorship">Sponsorship Plan</a></h1>
  <p>Sponsors are essential to Day of Data Detroit 2026. Sponsorship helps us keep attendance free while supporting technical education, networking, speaker support, attendee food and beverages, event materials, and community engagement for approximately 100 attendees across Detroit and Southeast Michigan.</p>
  <p>Organizations working with SQL Server, Azure SQL Database, SQL Server on Azure VMs, Microsoft Fabric, Power BI, Azure Data &amp; AI, Databricks, data engineering, analytics, AI, cloud, governance, security, developer tools, recruiting, and related technologies are especially encouraged to participate.</p>
  <h2>Sponsorship Levels</h2>
  <p>All sponsors will be recognized on the Day of Data Detroit event page and during the event. If you have an idea that does not fit one of the options below, please contact us. We are happy to discuss a community-friendly sponsorship or in-kind contribution.</p>
