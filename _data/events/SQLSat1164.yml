sponsorplan: |
  <h1><a name="sponsorship">Sponsorship Plan</a></h1>
  <p><strong>Confirmed Community Sponsor: Neo4j - $250.</strong></p>
  <p>Sponsors are essential to Day of Data Detroit 2026. We are promoting the event to 200+ potential registrants and community participants across Detroit and Southeast Michigan. The Northville District Library venue has a combined on-site capacity of approximately 70 across the two meeting rooms. Sponsorship supports technical education, networking, speaker support, attendee food and beverages, event materials, and community engagement.</p>
  <p>Conference admission is completely free. Attendees may register for free without purchasing lunch. A separate optional $15 lunch ticket is available for attendees who want the event-provided lunch.</p>
  <p>Organizations working with SQL Server, Azure SQL Database, SQL Server on Azure VMs, Microsoft Fabric, Power BI, Azure Data &amp; AI, Databricks, data engineering, analytics, AI, cloud, governance, security, developer tools, recruiting, education, financial services, automotive, professional services, and related technologies are encouraged to participate.</p>
  <h2>Sponsorship Levels</h2>
  <p>Small contributions are welcome. We added a $100 Community Supporter option so local businesses and teams can participate without a large event-marketing budget. All sponsors will be recognized on the Day of Data Detroit event page and during the event. If you have an idea that does not fit one of the options below, please contact us.</p>
