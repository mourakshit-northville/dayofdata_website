description: |
    <p><strong>Day of Data Detroit 2026</strong> is a free, community-driven, in-person technical event for data professionals, developers, architects, analysts, AI practitioners, students, technology leaders, and community members across Detroit, Southeast Michigan, and the surrounding region.</p>
    <p>We are planning for approximately 100 attendees. Registration will be required because capacity is limited. The registration link will be posted as soon as it is available.</p>
    <h3>Why Attend?</h3>
    <ul>
      <li>Learn practical techniques, patterns, and lessons from experienced community speakers and industry practitioners.</li>
      <li>See technical sessions and demos focused on real-world data, analytics, database, cloud, and AI scenarios.</li>
      <li>Connect with fellow data professionals, speakers, students, technology leaders, sponsors, and local community members.</li>
      <li>Build your professional network and discover new ideas for career development, certification, architecture, engineering, analytics, and AI.</li>
    </ul>
    <h3>Who Should Attend?</h3>
    <p>Content is intended for a wide range of skill levels, from students and early-career professionals to experienced DBAs, developers, data engineers, BI professionals, architects, administrators, AI/ML practitioners, consultants, managers, and technology leaders.</p>
    <h3>Topics We Are Building Around</h3>
    <ul>
      <li><strong>SQL Server and Azure SQL:</strong> administration, performance, development, modernization, high availability, security, and cloud database services.</li>
      <li><strong>Microsoft Fabric and Power BI:</strong> data engineering, analytics, semantic models, Real-Time Intelligence, governance, and business intelligence.</li>
      <li><strong>Databricks and Modern Data Engineering:</strong> lakehouse architecture, data pipelines, streaming, governance, analytics, and AI-enabled data platforms.</li>
      <li><strong>AI and Generative AI:</strong> machine learning, AI agents, copilots, retrieval-augmented generation, responsible AI, and practical enterprise AI scenarios.</li>
      <li><strong>Architecture, Governance, and Professional Development:</strong> data architecture, quality, security, governance, certification, career growth, and community knowledge sharing.</li>
    </ul>
    <p>Sessions will feature local and regional community speakers and industry practitioners. Venue, attendee registration, final speaker lineup, and schedule details will be added as they are finalized.</p>
    <p><strong>Community website:</strong> Day of Data Detroit is part of the volunteer-led <a href="/michigan-data-ai-community/">Michigan Data &amp; AI Community</a>, supporting technical speaking, learning, mentoring, volunteering, and community conferences across Michigan.</p>

