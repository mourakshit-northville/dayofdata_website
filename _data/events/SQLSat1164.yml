description: |
    <p><strong>Day of Data Detroit 2026</strong> is a community-driven, in-person technical event for data professionals, developers, architects, analysts, AI practitioners, students, technology leaders, and community members across Detroit, Southeast Michigan, and the surrounding region.</p>
    <p><strong>Conference admission is completely free.</strong> Eventbrite offers a free admission ticket for attendees who do not want to purchase lunch. A separate optional <strong>$15 lunch ticket</strong> is available for attendees who would like the event-provided lunch. No attendee is required to purchase lunch in order to attend. Registration is required because capacity is limited by the venue. <strong><a href="https://www.eventbrite.com/e/day-of-data-detroit-2026-tickets-1998135403781">Register now on Eventbrite</a>.</strong></p>
    <p><strong>Community reach:</strong> We are promoting the event across Southeast Michigan with a goal of 200+ registrations and community participants. On-site attendance at any one time is limited by the two library meeting rooms, which have a combined physical capacity of approximately 70.</p>
    <p><strong>Event hours:</strong> Saturday, September 12, 2026, 8:30 AM-5:00 PM EDT. Attendee check-in begins at 8:00 AM.</p>
    <p><strong>Venue:</strong> Northville District Library, 212 W Cady St, Northville, MI 48167. The event will use two meeting rooms: the Carlo Meeting Room (maximum 50 people) and the Friends Community Room (maximum 20 people), allowing up to two sessions to run in parallel.</p>
    <p><strong>Parking:</strong> Free parking is available at the Northville District Library. Additional nearby public parking is available in downtown Northville; please follow posted signs and time limits.</p>
    <h3>Why Attend?</h3>
    <ul>
      <li>Learn practical techniques, patterns, and lessons from experienced community speakers and industry practitioners.</li>
      <li>See technical sessions and demos focused on real-world data, analytics, database, cloud, and AI scenarios.</li>
      <li>Connect with fellow data professionals, speakers, students, technology leaders, sponsors, and local community members.</li>
      <li>Build your professional network and discover new ideas for career development, certification, architecture, engineering, analytics, and AI.</li>
    </ul>
    <h3>Who Should Attend?</h3>
    <p>Content is intended for a wide range of skill levels, from students and early-career professionals to experienced DBAs, developers, data engineers, BI professionals, architects, administrators, AI/ML practitioners, consultants, managers, and technology leaders.</p>
    <h3>Topics We Are Building Around</h3>
    <ul>
      <li><strong>SQL Server and Azure SQL:</strong> administration, performance, development, modernization, high availability, security, and cloud database services.</li>
      <li><strong>Microsoft Fabric and Power BI:</strong> data engineering, analytics, semantic models, Real-Time Intelligence, governance, and business intelligence.</li>
      <li><strong>Databricks and Modern Data Engineering:</strong> lakehouse architecture, data pipelines, streaming, governance, analytics, and AI-enabled data platforms.</li>
      <li><strong>AI and Generative AI:</strong> machine learning, AI agents, copilots, retrieval-augmented generation, responsible AI, and practical enterprise AI scenarios.</li>
      <li><strong>Architecture, Governance, and Professional Development:</strong> data architecture, quality, security, governance, certification, career growth, and community knowledge sharing.</li>
    </ul>
    <p>Sessions will feature local and regional community speakers and industry practitioners. The program will use two concurrent tracks where appropriate, based on the two available meeting rooms. The final speaker lineup and detailed schedule will be published as they are finalized.</p>
    <p><strong>Community website:</strong> Day of Data Detroit is part of the volunteer-led <a href="/michigan-data-ai-community/">Michigan Data &amp; AI Community</a>, supporting technical speaking, learning, mentoring, volunteering, and community conferences across Michigan.</p>

