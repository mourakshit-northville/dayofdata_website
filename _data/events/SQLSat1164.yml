  <p>Attendance is completely free for all attendees.</p>
  <p>Organizations working with SQL Server, Azure SQL, Microsoft Fabric, Power BI, Real-Time Intelligence, Azure Data &amp; AI, Azure Databricks, streaming, data engineering, analytics, AI, cloud, governance, security, developer tools, recruiting, and related technologies are especially encouraged to participate.</p>
  <h2>Sponsorship Levels</h2>
