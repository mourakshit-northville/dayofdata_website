  <h2>In-Kind and Community Sponsorship</h2>
  <p>We also welcome in-kind contributions. Examples include:</p>
  <ul>
    <li><strong>Facility / Venue Support</strong> - donated meeting space suitable for approximately 100 attendees.</li>
    <li><strong>Lunch Sponsor</strong> - support for attendee lunch.</li>
    <li><strong>Coffee, Water, and Snack Sponsor</strong> - beverages and refreshments during the event.</li>
    <li><strong>Speaker Support</strong> - speaker dinner, speaker gifts, or other speaker-related expenses.</li>
    <li><strong>Raffle / Giveaway Sponsor</strong> - books, software, training, gift cards, or other attendee prizes.</li>
    <li><strong>Event Materials Sponsor</strong> - printing, signage, badges, supplies, or attendee materials.</li>
  </ul>
  <p>Recognition for in-kind sponsors can be tailored to the type and value of the contribution.</p>
  <h2>Nonprofit Sponsorship Processing</h2>
  <p>SQL Saturday Corporation is a U.S. 501(c)(3) nonprofit organization. If your organization requires a nonprofit invoice or sponsorship receipt, please contact the organizer so sponsorship processing through SQL Saturday Corporation can be coordinated.</p>
  <p>For sponsorship opportunities, please email <a href="mailto:mouraksh@umich.edu">Mou Rakshit</a>.</p>
