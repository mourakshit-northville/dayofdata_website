  <h2>Food, Refreshment, Gift Card, and In-Kind Support</h2>
  <p>We also welcome small $100-$250 food/refreshment contributions and in-kind support. Useful options include:</p>
  <ul>
    <li><strong>Restaurant or Grocery Gift Cards / Food-Purchase Cards</strong> - flexible support that can be used to purchase the right quantity of attendee food and refreshments after final attendance is known.</li>
    <li><strong>Meal Cards or Catering Credit</strong> - restaurant credit, boxed-meal credit, pizza/sub/sandwich catering credit, or attendee meal certificates.</li>
    <li><strong>Coffee, Water, and Snack Support</strong> - bottled water, covered beverages, packaged snacks, fruit, bakery items, or other refreshments permitted by the venue.</li>
    <li><strong>Speaker Support</strong> - speaker dinner, speaker gifts, or other speaker-related expenses.</li>
    <li><strong>Raffle / Giveaway Sponsor</strong> - books, software, training, gift cards, or other attendee prizes.</li>
    <li><strong>Event Materials Sponsor</strong> - printing, signage, badges, supplies, or attendee materials.</li>
  </ul>
  <p>A full-event food donation is not required. Support for a portion of the attendees, a partial catering discount, or a modest gift card is very useful and can be combined with support from other community partners.</p>
  <p><strong>Donation restrictions:</strong> If a contribution is designated specifically for Day of Data Detroit 2026, it will be used only for this event. If a donor explicitly provides an unrestricted Michigan Data &amp; AI Community gift card, store credit, or community contribution, any remaining value after Day of Data Detroit may be used for future free Michigan Data &amp; AI Community meetup sessions. We will follow the donor's stated restriction.</p>
  <p>Recognition for in-kind sponsors can be tailored to the type and value of the contribution.</p>
  <h2>Nonprofit and Payment Processing</h2>
  <p>SQL Saturday Corporation is a U.S. 501(c)(3) nonprofit organization. Corporate sponsorship payments by credit card or check, as well as nonprofit invoices or sponsorship receipts, can be coordinated through SQL Saturday Corporation. Please contact the organizer for the official payment instructions before sending funds.</p>
  <p>For sponsorship opportunities, please email <a href="mailto:mouraksh@umich.edu">Mou Rakshit</a> or call 248-925-8004.</p>
