name: AI Portfolio Tests

on:
  push:
    branches: [main]
    paths:
      - "ai-architecture-portfolio/**"
      - ".github/workflows/ai-portfolio-tests.yml"
  pull_request:
    paths:
      - "ai-architecture-portfolio/**"
      - ".github/workflows/ai-portfolio-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile reference examples
        run: python -m compileall -q ai-architecture-portfolio

      - name: Run regression tests
        run: python -m unittest discover -s ai-architecture-portfolio/tests -p "test_*.py" -v
